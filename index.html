<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>千葉県 天気掲示板（リアルデータ版）</title>

<style>
body {
  margin: 0;
  background: #0f172a;
  color: #fff;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.board {
  background: #1e293b;
  padding: 30px;
  border-radius: 15px;
  width: 320px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

h1 {
  margin-bottom: 20px;
}

#area {
  font-size: 24px;
  margin-bottom: 10px;
}

#weather {
  font-size: 20px;
  margin: 10px 0;
}

#temp, #humidity {
  font-size: 18px;
}
</style>
</head>

<body>

<div class="board">
  <h1>千葉県 天気情報</h1>
  <div id="area">読み込み中...</div>
  <div id="weather">--</div>
  <div id="temp">気温: -- ℃</div>
  <div id="humidity">湿度: -- %</div>
</div>

<script>
// ===== エリア設定 =====
const areas = [
  { name: "野田方面", amedas: "45132" },   // 佐原
  { name: "銚子方面", amedas: "45147" },   // 銚子
  { name: "成田方面", amedas: "45132" },   // 佐原
  { name: "市原方面", amedas: "45166" }    // 千葉
];

let index = 0;

// ===== URL =====
const forecastURL = "https://www.jma.go.jp/bosai/forecast/data/forecast/120000.json";

// ===== データキャッシュ =====
let cachedWeather = "--";
let cachedTemp = "--";
let cachedHumidity = "--";

// ===== 天気取得 =====
async function fetchForecast() {
  try {
    const res = await fetch(forecastURL);
    const data = await res.json();

    // 千葉県の天気（今日）
    cachedWeather = data[0].timeSeries[0].areas[0].weathers[0];

  } catch (e) {
    cachedWeather = "取得失敗";
  }
}

// ===== アメダス取得 =====
async function fetchAmedas(code) {
  try {
    const url = `https://www.jma.go.jp/bosai/amedas/data/point/${code}.json`;

    const res = await fetch(url);
    const data = await res.json();

    const latestTime = Object.keys(data).pop();
    const latest = data[latestTime];

    cachedTemp = latest.temp ? latest.temp[0] : "--";
    cachedHumidity = latest.humidity ? latest.humidity[0] : "--";

  } catch (e) {
    cachedTemp = "--";
    cachedHumidity = "--";
  }
}

// ===== 表示更新 =====
async function updateDisplay() {
  const area = areas[index];

  await fetchAmedas(area.amedas);

  document.getElementById("area").textContent = area.name;
  document.getElementById("weather").textContent = cachedWeather;
  document.getElementById("temp").textContent = `気温: ${cachedTemp} ℃`;
  document.getElementById("humidity").textContent = `湿度: ${cachedHumidity} %`;

  index = (index + 1) % areas.length;
}

// ===== 初期処理 =====
async function init() {
  await fetchForecast();
  await updateDisplay();
}

init();

// ===== エリア切替（5秒） =====
setInterval(updateDisplay, 5000);

// ===== データ更新（5分） =====
setInterval(fetchForecast, 300000);

</script>

</body>
</html>
