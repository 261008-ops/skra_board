<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リアルタイム気象データ</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      margin-top: 20px;
    }
    .big {
      font-size: 2em;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h1>🌦️ リアルタイム気象データ</h1>

  <div class="box">
    <div>観測時刻</div>
    <div id="time" class="big">--</div>

    <div>気温</div>
    <div id="temp" class="big">-- ℃</div>

    <div>降水量</div>
    <div id="rain" class="big">-- mm</div>

    <div>風速</div>
    <div id="wind" class="big">-- m/s</div>
  </div>

<script>
const POINT_ID = "44132"; // ←ここ重要（東京）

async function fetchAmedas() {
  try {
    // 最新時刻取得
    const timeRes = await fetch("https://www.jma.go.jp/bosai/amedas/data/latest_time.txt");
    const latestTime = await timeRes.text();

    // データ取得
    const url = `https://www.jma.go.jp/bosai/amedas/data/point/${POINT_ID}/${latestTime}.json`;
    const res = await fetch(url);
    const data = await res.json();

    // データは配列形式なので最初の値を使う
    const firstKey = Object.keys(data)[0];
    const d = data[firstKey];

    // 表示
    document.getElementById("time").textContent = latestTime;
    document.getElementById("temp").textContent = (d.temp ? d.temp[0] : "--") + " ℃";
    document.getElementById("rain").textContent = (d.precipitation10m ? d.precipitation10m[0] : "--") + " mm";
    document.getElementById("wind").textContent = (d.wind ? d.wind[0] : "--") + " m/s";

  } catch (e) {
    console.error("エラー:", e);
  }
}

// 初回実行
fetchAmedas();

// 5分ごと更新
setInterval(fetchAmedas, 5 * 60 * 1000);
</script>

</body>
</html>
